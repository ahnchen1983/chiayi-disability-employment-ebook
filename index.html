  <style>
    :root {
      color-scheme: dark;
      --ink: #f8fafc;
      --muted: #cbd5e1;
      --night: #0b1220;
      --night-2: #111827;
      --yellow: #facc15;
      --yellow-2: #fde68a;
      --edge: rgba(255,255,255,.14);
      --shadow: 0 28px 70px rgba(0,0,0,.34);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 12% 8%, rgba(250,204,21,.16), transparent 28rem),
        radial-gradient(circle at 90% 75%, rgba(30,64,175,.20), transparent 32rem),
        var(--night);
      color: var(--ink);
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    }
    button { font: inherit; }
    .shell { width: min(1180px, calc(100% - 32px)); margin: 0 auto; padding: 34px 0 28px; }
    header { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 20px; }
    .eyebrow { margin: 0 0 8px; color: var(--yellow-2); font-size: .82rem; letter-spacing: .15em; }
    h1 { margin: 0; font-size: clamp(1.55rem, 3vw, 2.55rem); letter-spacing: .03em; line-height: 1.18; }
    .hint { margin: 9px 0 0; color: var(--muted); font-size: .96rem; }
    .counter { color: var(--yellow-2); font-size: .94rem; white-space: nowrap; }
    .reader { position: relative; }
    .book-wrap {
      position: relative;
      width: 100%;
      min-height: min(72vh, 820px);
      display: grid;
      place-items: center;
      padding: 20px 62px;
      border: 1px solid var(--edge);
      border-radius: 24px;
      background: linear-gradient(145deg, rgba(255,255,255,.07), rgba(255,255,255,.025));
      box-shadow: var(--shadow);
      overflow: hidden;
      isolation: isolate;
    }
    .book-wrap::before, .book-wrap::after { content: ""; position: absolute; z-index: -1; border-radius: 50%; filter: blur(2px); }
    .book-wrap::before { width: 360px; height: 360px; left: -160px; bottom: -220px; background: rgba(250,204,21,.13); }
    .book-wrap::after { width: 300px; height: 300px; right: -130px; top: -160px; background: rgba(37,99,235,.15); }
    .stage {
      position: relative;
      width: min(100%, 1060px);
      aspect-ratio: var(--ratio, 1 / 1);
      perspective: 2100px;
      filter: drop-shadow(0 22px 26px rgba(0,0,0,.28));
      /* Keep pinch-zoom available on touch devices while still allowing swipes. */
      touch-action: pan-x pan-y pinch-zoom;
    }
    .sheet {
      position: absolute;
      inset: 0;
      overflow: hidden;
      border-radius: 4px;
      background: #f8f4ea;
      transform-style: preserve-3d;
      backface-visibility: hidden;
    }
    .sheet img { display: block; width: 100%; height: 100%; object-fit: contain; background: #f8f4ea; user-select: none; -webkit-user-drag: none; }
    .sheet.current { z-index: 2; transform-origin: left center; }
    .sheet.under { z-index: 1; }
    .sheet.turn-next { animation: turnNext 1.5s cubic-bezier(.2,.72,.2,1) forwards; }
    .sheet.turn-prev { animation: turnPrev 1.5s cubic-bezier(.2,.72,.2,1) forwards; transform-origin: right center; }
    @keyframes turnNext { 0% { transform: rotateY(0); } 48% { box-shadow: 20px 0 26px rgba(0,0,0,.2); } 100% { transform: rotateY(-180deg); } }
    @keyframes turnPrev { 0% { transform: rotateY(0); } 48% { box-shadow: -20px 0 26px rgba(0,0,0,.2); } 100% { transform: rotateY(180deg); } }
    .nav {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: space-between;
      pointer-events: none; padding: 0 12px; z-index: 4;
    }
    .nav button, .control-btn {
      border: 1px solid rgba(255,255,255,.22);
      color: var(--ink); background: rgba(11,18,32,.78); backdrop-filter: blur(8px);
      cursor: pointer; transition: transform .18s ease, background .18s ease, border-color .18s ease;
    }
    .nav button { pointer-events: auto; width: 46px; height: 62px; border-radius: 13px; font-size: 1.6rem; }
    .nav button:hover:not(:disabled), .control-btn:hover:not(:disabled) { transform: translateY(-2px); background: rgba(250,204,21,.94); color: #111827; border-color: var(--yellow); }
    button:focus-visible { outline: 3px solid var(--yellow); outline-offset: 3px; }
    button:disabled { cursor: not-allowed; opacity: .35; }
    .controls { display: flex; align-items: center; gap: 10px; margin-top: 16px; }
    .control-btn { min-height: 42px; padding: 0 16px; border-radius: 11px; font-size: .95rem; }
    .progress { flex: 1; height: 6px; border-radius: 999px; overflow: hidden; background: rgba(255,255,255,.14); }
    .progress > span { display: block; width: 0; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--yellow), #fb923c); transition: width .3s ease; }
    .footer { display: flex; justify-content: space-between; gap: 16px; margin-top: 13px; color: var(--muted); font-size: .86rem; }
    .footer span:last-child { text-align: right; }
    .music-button[aria-pressed="true"] { border-color: var(--yellow); color: var(--yellow-2); }
    @media (max-width: 720px) {
      /* Phone reading mode: remove the desktop card and let the spread use the full viewport. */
      html, body { min-height: 100%; overflow-x: hidden; }
      .shell { width: 100%; padding: max(10px, env(safe-area-inset-top)) 0 max(8px, env(safe-area-inset-bottom)); }
      header { display: block; position: relative; padding: 9px 16px 10px; margin: 0; }
      header > div:first-child { padding-right: 112px; }
      .eyebrow { margin-bottom: 5px; font-size: .72rem; }
      h1 { font-size: clamp(1.28rem, 5.8vw, 1.72rem); }
      .hint { margin-top: 5px; font-size: .78rem; line-height: 1.35; }
      .counter { position: absolute; top: 50%; right: 16px; transform: translateY(-50%); font-size: .78rem; }
      .book-wrap { height: calc(100svh - 176px); min-height: 52svh; max-height: 700px; padding: 0; border: 0; border-radius: 0; background: #000; box-shadow: none; }
      .book-wrap::before, .book-wrap::after { display: none; }
      .stage { width: 100%; height: 100%; aspect-ratio: auto; filter: none; touch-action: pan-x pan-y pinch-zoom; }
      .sheet { border-radius: 0; background: #000; }
      .sheet img { background: #000; touch-action: inherit; }
      .nav { padding: 0 6px; }
      .nav button { width: 36px; height: 52px; border-radius: 10px; font-size: 1.25rem; }
      .controls { flex-wrap: wrap; margin: 8px 14px 0; gap: 7px; }
      .control-btn { min-height: 38px; padding: 0 12px; font-size: .82rem; }
      .progress { order: 3; flex-basis: 100%; }
      .footer { flex-direction: column; gap: 4px; margin: 7px 14px 0; text-align: center; font-size: .72rem; }
      .footer span:last-child { text-align: center; }
    }
    @media (max-width: 720px) and (orientation: landscape) {
      header { padding: 5px 12px 6px; }
      header > div:first-child { padding-right: 150px; }
      .eyebrow, .hint { display: none; }
      h1 { font-size: 1.05rem; }
      .counter { right: 12px; font-size: .76rem; }
      .book-wrap { height: calc(100svh - 84px); min-height: 0; }
      .controls { margin-top: 5px; }
      .footer { display: none; }
    }
    /* Compact layout for small Google Sites embed frames such as 676 x 329. */
    @media (max-height: 500px) {
      html, body { overflow: hidden; }
      .shell { width: 100%; height: 100vh; padding: 8px 10px 7px; }
      header, .footer { display: none; }
      .book-wrap { height: calc(100vh - 58px); min-height: 0; padding: 6px 42px; border-radius: 14px; }
      .stage { width: 100%; height: 100%; aspect-ratio: auto; }
      .nav { padding: 0 5px; }
      .nav button { width: 34px; height: 48px; border-radius: 9px; font-size: 1.25rem; }
      .controls { height: 36px; margin-top: 7px; gap: 7px; }
      .control-btn { min-height: 34px; padding: 0 11px; border-radius: 9px; font-size: .82rem; }
      .progress { height: 5px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
    /* Always use the compact reader when Google Sites loads this page in an iframe. */
    html.embed-mode, html.embed-mode body { overflow: hidden; }
    html.embed-mode .shell { width: 100%; height: 100vh; padding: 8px 10px 7px; }
    html.embed-mode header, html.embed-mode .footer { display: none; }
    html.embed-mode .book-wrap { height: calc(100vh - 58px); min-height: 0; padding: 6px 42px; border-radius: 14px; }
    html.embed-mode .stage { width: 100%; height: 100%; aspect-ratio: auto; }
    html.embed-mode .nav { padding: 0 5px; }
    html.embed-mode .nav button { width: 34px; height: 48px; border-radius: 9px; font-size: 1.25rem; }
    html.embed-mode .controls { height: 36px; margin-top: 7px; gap: 7px; }
    html.embed-mode .control-btn { min-height: 34px; padding: 0 11px; border-radius: 9px; font-size: .82rem; }
    html.embed-mode .progress { height: 5px; }
    /* Mobile overrides intentionally come after the embed rules so Google Sites embeds also work on phones. */
    @media (max-width: 720px) {
      html.mobile-mode .shell { width: 100%; height: 100svh; padding: max(10px, env(safe-area-inset-top)) 0 max(8px, env(safe-area-inset-bottom)); }
      html.mobile-mode header { display: block; position: relative; padding: 9px 16px 10px; margin: 0; }
      html.mobile-mode header > div:first-child { padding-right: 112px; }
      html.mobile-mode .book-wrap { height: calc(100svh - 176px); min-height: 52svh; max-height: 700px; padding: 0; border: 0; border-radius: 0; background: #000; box-shadow: none; }
      html.mobile-mode .book-wrap::before, html.mobile-mode .book-wrap::after { display: none; }
      html.mobile-mode .stage { width: 100%; height: 100%; aspect-ratio: auto; filter: none; touch-action: pan-x pan-y pinch-zoom; }
      html.mobile-mode .sheet { border-radius: 0; background: #000; }
      html.mobile-mode .sheet img { background: #000; touch-action: inherit; }
      html.mobile-mode .controls { height: auto; margin: 8px 14px 0; gap: 7px; }

      html.mobile-mode .footer span:last-child { text-align: center; }
    }
    @media (max-width: 720px) and (max-height: 500px) {
      html.mobile-mode .shell { padding: 4px 0; }
      html.mobile-mode header { display: none; }

<body>
  <main class="shell">
    <header>
      <div>
        <p class="eyebrow">嘉義縣政府出版</p>
        <h1>我學會了看見不一樣</h1>
        <p class="hint">嘉義縣身心障礙者就業促進業務成果宣導計畫｜電子繪本</p>
      </div>
      <div class="counter" aria-live="polite"><span id="pageLabel">封面</span> ／ 28</div>
    </header>

    <section class="reader" aria-label="電子繪本閱讀器">
      <div class="book-wrap">
        <div class="stage" id="stage" style="--ratio: 1 / 1" aria-live="polite">
          <div class="sheet under"><img id="underImage" alt="下一頁繪本畫面" draggable="false"></div>
          <div class="sheet current"><img id="currentImage" alt="目前繪本畫面" draggable="false"></div>
        </div>
        <nav class="nav" aria-label="翻頁按鈕">
          <button id="prev" type="button" aria-label="上一頁">‹</button>
          <button id="next" type="button" aria-label="下一頁">›</button>
        </nav>
      </div>
      <div class="controls">
        <button class="control-btn" id="first" type="button">回到封面</button>
        <button class="control-btn" id="fullscreen" type="button">全螢幕</button>
        <button class="control-btn music-button" id="music" type="button" aria-pressed="false">播放音樂</button>
        <div class="progress" aria-hidden="true"><span id="progressBar"></span></div>
      </div>
      <div class="footer">
        <span>點擊左右按鈕、使用鍵盤 ← →，或在畫面上左右滑動翻頁</span>
        <span>建議橫向閱讀跨頁</span>
      </div>
    </section>
  </main>
  <audio id="backgroundMusic" loop preload="metadata">
    <source src="繪本背景音樂_試聽版.wav" type="audio/wav">
  </audio>

  <script>
    (() => {
      const total = 28;
      const page = (n) => `pages/page-${String(n).padStart(2, '0')}.jpg`;
      const stage = document.getElementById('stage');
      const currentSheet = document.querySelector('.sheet.current');
      const currentImage = document.getElementById('currentImage');
      const underImage = document.getElementById('underImage');
      const pageLabel = document.getElementById('pageLabel');
      const progressBar = document.getElementById('progressBar');
      const prev = document.getElementById('prev');
      const next = document.getElementById('next');
      const fullscreenButton = document.getElementById('fullscreen');
      const musicButton = document.getElementById('music');
      const backgroundMusic = document.getElementById('backgroundMusic');
      let index = 1;
      let busy = false;
      let touchX = 0;
      let activePointers = new Set();
      let gestureHadMultiplePointers = false;
      let hasOpened = false;

      function label(n) { return n === 1 ? '封面' : `第 ${n - 1} 個跨頁`; }
      function track(name, params = {}) {
        if (typeof window.gtag === 'function') window.gtag('event', name, params);
      }
      function preload(n) { if (n >= 1 && n <= total) { const img = new Image(); img.src = page(n); } }
      function fitRatio(n) {
        const img = new Image();
        img.onload = () => { stage.style.setProperty('--ratio', `${img.naturalWidth} / ${img.naturalHeight}`); };
        img.src = page(n);
      }
      function render() {
        currentImage.src = page(index);
        currentImage.alt = `目前繪本畫面：${label(index)}`;
        const nextIndex = Math.min(total, index + 1);
        underImage.src = page(nextIndex);
        underImage.alt = `下一頁繪本畫面：${label(nextIndex)}`;
        pageLabel.textContent = label(index);
        progressBar.style.width = `${(index / total) * 100}%`;
        prev.disabled = index === 1;
        next.disabled = index === total;
        fitRatio(index);
        preload(index - 1); preload(index + 1);
        history.replaceState(null, '', `#page-${index}`);
        track('page_view', { page_title: `我學會了看見不一樣 - ${label(index)}`, page_number: index, page_location: location.href });
        if (!hasOpened) {
          track('ebook_open', { page_number: index, page_label: label(index) });
          hasOpened = true;
        }
      }
      function go(direction, interaction = 'button') {
        if (busy) return;
        const target = index + direction;
        if (target < 1 || target > total) return;
        busy = true;
        const targetImg = page(target);
        underImage.src = targetImg;
        currentSheet.classList.remove('turn-next', 'turn-prev');
        void currentSheet.offsetWidth;
        currentSheet.classList.add(direction > 0 ? 'turn-next' : 'turn-prev');
        currentSheet.addEventListener('animationend', () => {
          index = target;
          currentSheet.classList.remove('turn-next', 'turn-prev');
          track('flip_page', { from_page: index - direction, to_page: index, page_number: index, direction: direction > 0 ? 'next' : 'previous', interaction });
          render();
          busy = false;
        }, { once: true });
      }
      function jump(n) {
        if (!busy && n >= 1 && n <= total && n !== index) {
          const fromPage = index;
          index = n;
          track('jump_to_page', { from_page: fromPage, to_page: index, page_number: index, interaction: 'button' });
          render();
        }
      }

      prev.addEventListener('click', () => go(-1, 'button'));
      next.addEventListener('click', () => go(1, 'button'));
      document.getElementById('first').addEventListener('click', () => jump(1));
      backgroundMusic.volume = 0.22;
      function updateMusicButton() {
        const playing = !backgroundMusic.paused;
        musicButton.textContent = playing ? '暫停音樂' : '播放音樂';
        musicButton.setAttribute('aria-pressed', String(playing));
      }
      async function startMusic() {
        try {
          await backgroundMusic.play();
          updateMusicButton();
          track('background_music', { action: 'play' });
        } catch (_) {
          updateMusicButton();
        }
      }
      musicButton.addEventListener('click', async () => {
        if (backgroundMusic.paused) {
          await startMusic();
        } else {
          backgroundMusic.pause();
          updateMusicButton();
          track('background_music', { action: 'pause' });
        }
      });
      backgroundMusic.addEventListener('play', updateMusicButton);
      backgroundMusic.addEventListener('pause', updateMusicButton);
      document.addEventListener('pointerdown', (event) => {
        if (event.target !== musicButton && backgroundMusic.paused) startMusic();
      }, { once: true });
      const openStandalone = () => {
        const standaloneUrl = new URL(location.href);
        track('open_standalone', { page_number: index, page_label: label(index) });
        window.open(standaloneUrl.href, '_blank', 'noopener');
      };
      if (window.top !== window.self) {
        fullscreenButton.textContent = '獨立開啟';
        fullscreenButton.setAttribute('aria-label', '在新分頁獨立開啟電子書');
      }
      fullscreenButton.addEventListener('click', () => {
        const target = document.querySelector('.reader');
        if (window.top !== window.self || !document.fullscreenEnabled || !target.requestFullscreen) {
          openStandalone();
          return;
        }
        const action = document.fullscreenElement ? 'exit' : 'enter';
        track('fullscreen', { action });
        if (!document.fullscreenElement) {
          target.requestFullscreen().catch(() => openStandalone());
        } else {
          document.exitFullscreen?.();
        }
      });
      document.addEventListener('keydown', (event) => {
        if (event.key === 'ArrowRight' || event.key === 'PageDown') { event.preventDefault(); go(1, 'keyboard'); }
        if (event.key === 'ArrowLeft' || event.key === 'PageUp') { event.preventDefault(); go(-1, 'keyboard'); }
        if (event.key === 'Home') { event.preventDefault(); jump(1); }
      });
      stage.addEventListener('pointerdown', (event) => {
        activePointers.add(event.pointerId);
        if (activePointers.size > 1) gestureHadMultiplePointers = true;
        touchX = event.clientX;
      });
      stage.addEventListener('pointerup', (event) => {
        const wasMultiTouch = gestureHadMultiplePointers;
        activePointers.delete(event.pointerId);
        if (activePointers.size === 0) gestureHadMultiplePointers = false;
        if (wasMultiTouch || event.pointerType === 'mouse') return;
        const delta = event.clientX - touchX;
        if (Math.abs(delta) > 48) go(delta < 0 ? 1 : -1, 'swipe');
      });
      stage.addEventListener('pointercancel', (event) => {
        activePointers.delete(event.pointerId);
        if (activePointers.size === 0) gestureHadMultiplePointers = false;
      });
      const hashMatch = location.hash.match(/page-(\d+)/);
      if (hashMatch) index = Math.min(total, Math.max(1, Number(hashMatch[1])));
      render();
    })();
  </script>
</body>
